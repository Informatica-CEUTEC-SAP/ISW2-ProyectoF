<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — Patitas</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f2f7f5; color: #12322d; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #fff; padding: 2rem; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); width: 100%; max-width: 380px; }
    h1 { font-size: 1.5rem; margin-top: 0; color: #1f8a70; }
    label { display: block; margin-top: 1rem; font-weight: 600; font-size: 0.9rem; }
    input { width: 100%; padding: 0.65rem; margin-top: 0.35rem; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
    button { width: 100%; margin-top: 1.5rem; padding: 0.75rem; background: #1f8a70; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .error { color: #b91c1c; font-size: 0.85rem; margin-top: 0.75rem; display: none; }
    .hint { font-size: 0.8rem; color: #55706a; margin-top: 1rem; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🐾 Acceso a Patitas</h1>
    <form id="loginForm">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" placeholder="admin@patitas.website" required>
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required>
      <button type="submit">Iniciar sesión</button>
      <p id="errorMsg" class="error"></p>
    </form>
    <p class="hint">Demo: admin@patitas.website / Patitas2026!</p>
  </div>
  <script>
    const supabaseClient = supabase.createClient(
      'https://hvqgxfimhymsqfwpnysm.supabase.co',
      'sb_publishable_9pz6We3N19ytazqNrNQeAg_TJcSkfAb'
    );

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        errorMsg.textContent = 'Credenciales inválidas: ' + error.message;
        errorMsg.style.display = 'block';
      } else {
        window.location.href = '/admin';
      }
    });
  </script>
</body>
</html>
